# Configuración Trapeze para Ionic + Angular + Capacitor
# Template optimizado para control de versiones automatizado
# Compatible con ionic-version-manager

platforms:
  android:
    # Configuración de versiones Android
    versionName: 1.0.0
    versionCode: 100000

  ios:
    # Configuración de versiones iOS (igual que Android)
    version: 1.0.0
    buildNumber: 100000
